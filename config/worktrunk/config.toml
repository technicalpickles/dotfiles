# worktrunk - git worktree manager (wt)
# https://worktrunk.dev
#
# Regenerate a fully commented reference with: wt config create
# Full docs on this section:                   https://worktrunk.dev/config/#worktree-path-template

# Nest worktrees inside the repo itself, matching Claude Code's own
# .claude/worktrees/<branch> convention (EnterWorktree/agent-created
# worktrees already land there). This drops the previous centralized
# ~/worktrees hub in favor of nested paths already covered by the sandbox's
# implicit cwd allowance -- see claude/rules/worktrees.md.
worktree-path = "{{ repo_path }}/.claude/worktrees/{{ branch | sanitize }}"

# cowtree's default compaction donor is the repo's primary worktree, and it
# hard-aborts the whole repo's compaction if that donor is dirty rather than
# falling through to a clean sibling. `pt cowtree-compact` picks a clean
# donor first (or skips if every worktree in the repo is dirty) -- see
# pickleton's projects/pt-tooling/design/2026-09-11-plain-layout-bulk-migration-and-cowtree.md.
# Only fires for :plain-layout pt repos today (the only ones created via `wt
# switch --create`); harmless no-op elsewhere. `pickletown`, not `pt` -- `pt`
# is a shell alias, unavailable to this non-interactive hook subprocess.
# `command -v` guard: this repo (pickletown) isn't set up on every machine
# this config syncs to, so skip quietly there instead of a "command not
# found" line in every worktree's hook log.
[post-start]
compact = "command -v pickletown >/dev/null 2>&1 && pickletown cowtree-compact {{ branch }} --repo-path {{ repo_path }} || true"
