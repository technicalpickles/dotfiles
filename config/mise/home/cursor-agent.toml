# Home-role-only tools. miseconfig.sh symlinks this into conf.d/ (gitignored)
# on the home role and removes the link elsewhere.

# Cursor CLI (cursor-agent). cursor.com/install is just a tarball download plus
# symlinks into ~/.local/bin, so mise's http backend does the same job and puts
# it on PATH as `cursor-agent` (no `agent` alias). No releases API exists: the
# current version is only published inside that install script, so Renovate
# reads it from there (renovate.json, custom.cursor-agent datasource).
[tools."http:cursor-agent"]
# renovate: datasource=custom.cursor-agent depName=cursor-agent versioning=loose
version = "2026.11.13-eacade1"

[tools."http:cursor-agent".platforms]
macos-arm64 = { url = "https://downloads.cursor.com/lab/{{version}}/darwin/arm64/agent-cli-package.tar.gz" }
macos-x64 = { url = "https://downloads.cursor.com/lab/{{version}}/darwin/x64/agent-cli-package.tar.gz" }
linux-arm64 = { url = "https://downloads.cursor.com/lab/{{version}}/linux/arm64/agent-cli-package.tar.gz" }
linux-x64 = { url = "https://downloads.cursor.com/lab/{{version}}/linux/x64/agent-cli-package.tar.gz" }
