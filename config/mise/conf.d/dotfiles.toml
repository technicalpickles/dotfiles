[tools]
bun = "1.3.14"
# Pinned: all running instances must be the same build; bump, then restart agents.
"github:DeusData/codebase-memory-mcp" = "0.11.0"
# agent-safehouse (bin/safe wrapper, ADR 0060). The release's only asset is a
# bare safehouse.sh with no platform in its name, so auto-matching fails
# without asset_pattern; mise renames it to `safehouse`. macOS-only (Seatbelt).
"github:eugene1g/agent-safehouse" = { version = "0.12.0", asset_pattern = "safehouse.sh", bin = "safehouse", os = [
  "macos",
] }
fnox = "latest"
go = "1.26"
node = "lts"
"npm:markdownlint-cli2" = "0.22.0"
# Claude Code statusline (claude/roles/base.jsonc). Installed here instead of
# `npx -y ccstatusline@x.y.z` because npm startup alone cost 21-68% CPU per
# refresh, per session. Pinned: bump on purpose.
"npm:ccstatusline" = "2.2.32"
pitchfork = "latest"
pkl = "0.30.0"
python = "3.13"
# rust here is a symlink install pointing at ~/.cargo/bin (mise ls shows
# "(symlink)"), so `mise reshim` generates a shim for every cargo-installed
# binary: cq, bowerbird, himalaya, ortie, rtk, plus rustc/cargo themselves.
# Without a global version those shims all die with "No version is set for
# shim: <name>" wherever the shims dir sorts ahead of ~/.cargo/bin on PATH.
rust = "stable"
# starship lives here, not in Brewfile, because it needs to work on Linux too.
# The upstream curl | sh installer calls `sudo -v`, which fails on a
# NOPASSWD-only host with no tty (no credential to validate). mise installs
# the same version with no sudo.
starship = "latest"
uv = "latest"
